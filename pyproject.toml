[project]
name = "vggt4d"
version = "0.0.0"
description = "VGGT4D: Mining Motion Cues in Visual Geometry Transformers for 4D Scene Reconstruction"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pillow",
    "huggingface_hub",
    "einops",
    "safetensors",
    "gradio==6.0.2",
    "viser==1.0.16",
    "tqdm",
    "hydra-core==1.3.2",
    "omegaconf==2.3.0",
    "opencv-python==4.11.0.86",
    "scipy==1.16.3",
    "onnxruntime==1.23.2",
    "requests",
    "trimesh==4.10.1",
    "matplotlib==3.10.7",
    "pydantic==2.12.4",
    "pycolmap==3.10.0",
    "pyceres==2.6",
    "scikit-image==0.25.2",
    "scikit-learn==1.7.2",
    "open3d==0.19.0",
    "evo==1.34.0",
    "torch==2.9.1",
    "torchvision==0.24.1",
    "lightglue @ git+https://github.com/jytime/LightGlue.git@2f23ca2ea9638cecad7f7220795210fc6b8353c3",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["vggt*", "vggt4d*"]
