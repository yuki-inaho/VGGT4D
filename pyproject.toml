[project]
name = "vggt4d"
version = "0.1.0"
description = "VGGT4D: Mining Motion Cues in Visual Geometry Transformers for 4D Scene Reconstruction"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Blackwell (sm_120) requires a CUDA 13.0 build; cu118 wheels have no
    # kernel image for this GPU. These versions are also used by the
    # Blackwell-validated VGGT environment in this workspace.
    "torch==2.12.0",
    "torchvision==0.27.0",
    "numpy",
    "Pillow",
    "huggingface_hub",
    "einops",
    "safetensors",
    "viser",
    "tqdm",
    "hydra-core",
    "omegaconf",
    "opencv-python",
    "scipy",
    "onnxruntime",
    "requests",
    "trimesh",
    "matplotlib",
    "pydantic",
    "pycolmap==3.10.0",
    "pyceres",
    "scikit-image",
    "scikit-learn",
    "open3d",
    "evo",
    "lightglue",
    "jaxtyping>=0.2",
    "rerun-sdk>=0.22",
    "playwright>=1.40",
    "pyvista>=0.48.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
    "ty>=0.0.1a1",
    "radon>=6",
]

[tool.uv]
no-build-isolation-package = ["pyceres"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]
# jaxtyping uses string-based shape DSL inside type annotations,
# which ruff flags as F722 (forward-ref syntax) / F821 (undefined name).
ignore = ["F722", "F821"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]


[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
lightglue = { git = "https://github.com/jytime/LightGlue.git" }
